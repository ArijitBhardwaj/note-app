<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <h1>Notes App</h1>
    <div class="form-group">
      <input type="email" id="email" placeholder="Email">
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="Password">
    </div>
    <div class="button-group">
      <button id="signin-btn" class="btn primary">Sign In</button>
      <button id="signup-btn" class="btn secondary">Sign Up</button>
    </div>
    <div id="auth-message" class="message"></div>
  </div>

  <div id="dashboard" class="dashboard hidden">
    <div class="header">
      <h2>My Notes</h2>
      <button id="signout-btn" class="btn signout">Sign Out</button>
    </div>
    
    <div id="notes-list" class="notes-list"></div>
    
    <div class="new-note">
      <input type="text" id="new-note-input" placeholder="Add new note...">
      <button id="add-note-btn" class="btn primary">Add</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
