<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 300px;
        padding: 15px;
        font-family: Arial, sans-serif;
        background: #f0f2f5;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #noteInput {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }
      button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled {
        background: #cccccc;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input type="text" id="noteInput" placeholder="Enter your note..." />
      <button id="saveButton">Save Note</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
